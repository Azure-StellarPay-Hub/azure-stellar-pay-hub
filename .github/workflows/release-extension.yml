name: Release Extension

on:
  push:
    tags:
      - 'extension-v*'
  workflow_dispatch:

concurrency:
  group: release-extension-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.32.1

jobs:
  release:
    name: Build & release extension ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies (extension-only, not in pnpm workspace)
        run: |
          cd apps/extension
          npm install

      - name: Build extension
        run: |
          cd apps/extension
          node build.mjs

      - name: Package extension (CI mode)
        run: |
          cd apps/extension
          node package-extension.mjs --ci

      - name: Read extension version
        id: version
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('apps/extension/manifest.json','utf8')).version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@da9ff3b4b6cb1a3e7da38e4983ffdd58ffab42eb # v2
        with:
          name: StellarPay Hub v${{ steps.version.outputs.version }}
          files: apps/extension/dist/stellar-pay-extension-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Summary
        run: |
          echo "## ✅ Extension v${{ steps.version.outputs.version }} released" >> "$GITHUB_STEP_SUMMARY"
          echo "Download: [stellar-pay-extension-${{ steps.version.outputs.version }}.zip](https://github.com/\${{ github.repository }}/releases/tag/${{ github.ref_name }})" >> "$GITHUB_STEP_SUMMARY"
