name: Bug Report
description: File a bug report to help us improve
title: 'bug: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the form below.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: 'When I try to submit a payment with...'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Which component is affected?
      options:
        - API (apps/api)
        - Web app (apps/web)
        - Admin dashboard (apps/admin)
        - Explorer (apps/explorer)
        - Smart contracts (contracts/)
        - SDK (packages/sdk)
        - Database (packages/database)
        - Wallet integration
        - CI/CD
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: 'Node version, OS, browser, Stellar network (testnet/mainnet), etc.'
      placeholder: 'Node 22, macOS, Chrome 130, Stellar testnet'
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste any relevant logs or screenshots. Use code blocks for logs.
      render: shell
