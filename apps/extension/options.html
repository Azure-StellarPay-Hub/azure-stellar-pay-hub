<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StellarPay Hub — Settings</title>
    <style>
      :root {
        --bg: #0f0f11;
        --surface: #1a1a1f;
        --border: #2a2a35;
        --text: #e4e4e7;
        --text-muted: #71717a;
        --accent: #7b3fe4;
        --radius: 10px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        max-width: 480px;
        margin: 0 auto;
        padding: 24px;
      }
      h1 {
        font-size: 20px;
        margin-bottom: 24px;
      }
      .field {
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 13px;
        color: var(--text-muted);
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        font-size: 14px;
        outline: none;
      }
      input:focus {
        border-color: var(--accent);
      }
      button {
        padding: 10px 20px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: var(--radius);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button.danger {
        background: #ef4444;
        margin-left: 8px;
      }
      .saved {
        color: #22c55e;
        font-size: 13px;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <h1>⚡ StellarPay Settings</h1>

    <div class="field">
      <label for="api-url">API URL</label>
      <input type="url" id="api-url" placeholder="http://localhost:4000" />
    </div>

    <div>
      <button id="save-btn">Save</button>
      <button id="logout-btn" class="danger">Disconnect Wallet</button>
    </div>
    <div id="save-status" class="saved" style="display: none">Saved ✓</div>

    <script type="module" src="options.js"></script>
  </body>
</html>
