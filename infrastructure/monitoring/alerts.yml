groups:
  - name: stellar-pay
    rules:
      - alert: ApiDown
        expr: up{job="stellar-pay-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'API is unreachable'
          description: 'The API instance {{ $labels.instance }} has been down for over 2 minutes.'

      - alert: HighPaymentFailureRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m])
          /
          clamp_min(rate(http_requests_total[5m]), 0.0001)
          > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Elevated API error rate'
          description: 'More than 10% of requests are failing over the last 10 minutes.'

      - alert: DatabaseConnectionsExhausted
        expr: pg_stat_database_numbackends > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High database connection count'
