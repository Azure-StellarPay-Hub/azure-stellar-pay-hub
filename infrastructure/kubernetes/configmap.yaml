apiVersion: v1
kind: ConfigMap
metadata:
  name: stellar-pay-config
  namespace: stellar-pay
data:
  NODE_ENV: production
  STELLAR_NETWORK: testnet
  HORIZON_URL: https://horizon-testnet.stellar.org
  SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
  API_PORT: "4000"
  CORS_ORIGINS: "https://app.stellar-pay.example,https://admin.stellar-pay.example,https://explorer.stellar-pay.example"
  WEB_APP_URL: https://app.stellar-pay.example
  ADMIN_APP_URL: https://admin.stellar-pay.example
  EXPLORER_APP_URL: https://explorer.stellar-pay.example
  DOCS_APP_URL: https://docs.stellar-pay.example
