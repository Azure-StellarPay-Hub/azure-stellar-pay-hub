apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: stellar-pay
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ['redis-server', '--appendonly', 'yes']
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: stellar-pay
spec:
  selector: { app: redis }
  ports:
    - port: 6379
      targetPort: 6379
